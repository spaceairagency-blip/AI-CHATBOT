<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #dfe9e6;
    --panel: #ffffff;
    --ink: #14262b;
    --muted: #5b7076;
    --line: #c6d5d1;
    --accent: #0c5d63;
    --accent-ink: #ffffff;
    --user: #0c5d63;
    --bot: #eef4f2;
    --focus: #e0861a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1c1f;
      --panel: #16292d;
      --ink: #e3efec;
      --muted: #8fa8ad;
      --line: #284147;
      --accent: #3fb7ac;
      --accent-ink: #072326;
      --user: #1d6f73;
      --bot: #1d3338;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .layout {
    height: 100%;
    display: grid;
    grid-template-columns: minmax(120px, 1fr) minmax(0, 760px) minmax(120px, 1fr);
    gap: 16px;
    padding: 16px;
  }
  .rail {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .rail-inner { width: 100%; max-width: 300px; min-height: 250px; }

  .chat {
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .chat-head {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .chat-head h1 { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; }
  .chat-head button {
    font: inherit; font-size: .875rem; color: var(--muted);
    background: none; border: 0; cursor: pointer; padding: 4px 8px; border-radius: 8px;
  }
  .chat-head button:hover { color: var(--ink); background: var(--bot); }

  .log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .empty {
    margin: auto;
    max-width: 34ch;
    text-align: center;
    color: var(--muted);
  }
  .empty strong { display: block; color: var(--ink); font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot  { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; background: transparent; border: 1px solid #c0392b; color: #c0392b; }
  .msg.pending::after { content: "…"; color: var(--muted); }

  .composer {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 14px 16px;
    border-top: 1px solid var(--line);
  }
  .composer textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    font: inherit;
    color: var(--ink);
    background: var(--bot);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .composer button {
    font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 12px; padding: 10px 18px; cursor: pointer;
  }
  .composer button:disabled { opacity: .5; cursor: not-allowed; }

  /* Narrow screens: rails become strips above and below the chat */
  @media (max-width: 960px) {
    .layout {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      padding: 10px;
      gap: 10px;
    }
    .rail { max-height: 120px; }
    .rail-inner { max-width: 100%; min-height: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="layout">

  <!-- LEFT SIDE ADVERTISEMENT -->
  <aside class="rail rail-left" aria-label="Advertisement">
    <div class="rail-inner">
      <script>
      (function(eruj){
      var d = document,
          s = d.createElement('script'),
          l = d.currentScript || d.scripts[d.scripts.length - 1];
      s.settings = eruj || {};
      s.src = "\/\/quarrelsomebitter.com\/bHXKV.sTdvGMlc0\/YKWkcF\/OeGmy9wuuZNUcl\/kwPkTice1\/M_zKgozIM\/jaE-tvNnzzU\/zVOJDeM\/yqN\/Qj";
      s.async = true;
      s.referrerPolicy = 'no-referrer-when-downgrade';
      l.parentNode.insertBefore(s, l);
      })({})
      </script>
    </div>
  </aside>

  <!-- CHAT -->
  <main class="chat">
    <header class="chat-head">
      <h1>AI Chatbot</h1>
      <button type="button" id="clear">Clear chat</button>
    </header>
    <div class="log" id="log" aria-live="polite">
      <div class="empty" id="empty">
        <strong>Ask me anything</strong>
        Type a question below and press Enter to send.
      </div>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Type your message" aria-label="Message"></textarea>
      <button type="button" id="send">Send</button>
    </div>
  </main>

  <!-- RIGHT SIDE ADVERTISEMENT -->
  <aside class="rail rail-right" aria-label="Advertisement">
    <div class="rail-inner">
      <script>
      (function(eruj){
      var d = document,
          s = d.createElement('script'),
          l = d.currentScript || d.scripts[d.scripts.length - 1];
      s.settings = eruj || {};
      s.src = "\/\/quarrelsomebitter.com\/bHXKV.sTdvGMlc0\/YKWkcF\/OeGmy9wuuZNUcl\/kwPkTice1\/M_zKgozIM\/jaE-tvNnzzU\/zVOJDeM\/yqN\/Qj";
      s.async = true;
      s.referrerPolicy = 'no-referrer-when-downgrade';
      l.parentNode.insertBefore(s, l);
      })({})
      </script>
    </div>
  </aside>

</div>

<script>
(function () {
  var log = document.getElementById("log");
  var empty = document.getElementById("empty");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var clearBtn = document.getElementById("clear");
  var history = [];
  var busy = false;

  function addMsg(role, text, pending) {
    if (empty) { empty.remove(); empty = null; }
    var el = document.createElement("div");
    el.className = "msg " + role + (pending ? " pending" : "");
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }

  async function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    input.value = "";
    autosize();

    history.push({ role: "user", content: text });
    addMsg("user", text);
    var botEl = addMsg("bot", "", true);
    var reply = "";

    try {
      var res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });

      if (!res.ok) {
        var info = {};
        try { info = await res.json(); } catch (e) {}
        throw new Error(info.error || ("Request failed (" + res.status + ")"));
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      while (true) {
        var r = await reader.read();
        if (r.done) break;
        buffer += decoder.decode(r.value, { stream: true });
        var lines = buffer.split("\n");
        buffer = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf("data:") !== 0) continue;
          var data = line.slice(5).trim();
          if (data === "[DONE]") continue;
          try {
            var json = JSON.parse(data);
            var delta = json.choices && json.choices[0] && json.choices[0].delta;
            if (delta && delta.content) {
              reply += delta.content;
              botEl.textContent = reply;
              log.scrollTop = log.scrollHeight;
            }
          } catch (e) { /* ignore partial JSON */ }
        }
      }

      botEl.classList.remove("pending");
      if (!reply) throw new Error("The model returned an empty reply. Try again.");
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      botEl.remove();
      history.pop(); // drop the unanswered user message so a retry is clean
      addMsg("error", err.message || "Something went wrong. Try again.");
    } finally {
      busy = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  clearBtn.addEventListener("click", function () {
    history = [];
    log.innerHTML = "";
    empty = document.createElement("div");
    empty.className = "empty";
    empty.id = "empty";
    empty.innerHTML = "<strong>Ask me anything</strong>Type a question below and press Enter to send.";
    log.appendChild(empty);
  });
})();
</script>
</body>
</html>
